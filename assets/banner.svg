<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080c" />
      <stop offset="50%" stop-color="#0b1118" />
      <stop offset="100%" stop-color="#05080c" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#007799" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16222f" stroke-width="1" />
      <circle cx="40" cy="40" r="1.5" fill="#00e5ff" fill-opacity="0.3" />
    </pattern>
    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes blinkPulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.3; }
      }
      @keyframes scanline {
        0% { transform: translateY(0px); }
        100% { transform: translateY(320px); }
      }
      .hud-title { font-family: 'Courier New', Courier, monospace; font-size: 38px; font-weight: 900; fill: #00e5ff; letter-spacing: 6px; }
      .hud-sub { font-family: 'Courier New', Courier, monospace; font-size: 15px; font-weight: 700; fill: #8b9bb4; letter-spacing: 3px; }
      .hud-tag { font-family: 'Courier New', Courier, monospace; font-size: 12px; font-weight: bold; fill: #3fb950; letter-spacing: 2px; }
      .hud-alert { font-family: 'Courier New', Courier, monospace; font-size: 11px; font-weight: bold; fill: #f1e05a; }
      .radar-line { transform-origin: 1040px 160px; animation: radarSweep 6s linear infinite; }
      .live-dot { animation: blinkPulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" />
  <rect width="1200" height="320" fill="url(#grid)" />

  <!-- Outer Tactical Border & Corner Brackets -->
  <rect x="20" y="20" width="1160" height="280" fill="none" stroke="#223547" stroke-width="2" />
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#00e5ff" stroke-width="4" />
  <path d="M 1180 50 L 1180 20 L 1150 20" fill="none" stroke="#00e5ff" stroke-width="4" />
  <path d="M 20 270 L 20 300 L 50 300" fill="none" stroke="#00e5ff" stroke-width="4" />
  <path d="M 1180 270 L 1180 300 L 1150 300" fill="none" stroke="#00e5ff" stroke-width="4" />

  <!-- Reticle Crosshair Marks -->
  <line x1="600" y1="20" x2="600" y2="35" stroke="#00e5ff" stroke-width="2" />
  <line x1="600" y1="285" x2="600" y2="300" stroke="#00e5ff" stroke-width="2" />
  <line x1="20" y1="160" x2="35" y2="160" stroke="#00e5ff" stroke-width="2" />

  <!-- Left Status Block -->
  <rect x="50" y="45" width="220" height="26" fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-width="1" />
  <circle cx="65" cy="58" r="5" fill="#3fb950" class="live-dot" />
  <text x="80" y="62" class="hud-tag">STATUS: SOVEREIGN</text>

  <!-- Main Titles -->
  <text x="50" y="125" class="hud-title">SAORI TACTICAL</text>
  <text x="50" y="155" class="hud-sub">EMERGENCY OPERATIONS // RF SPECTRUM &amp; OFF-GRID SURVIVAL OS</text>

  <!-- Horizontal Tech Divider -->
  <line x1="50" y1="175" x2="880" y2="175" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="2" />
  <polygon points="50,175 70,170 70,180" fill="#00e5ff" />

  <!-- System Specifications Grid -->
  <g transform="translate(50, 205)">
    <!-- Column 1 -->
    <rect x="0" y="0" width="260" height="65" fill="#0d1722" stroke="#1f3246" stroke-width="1" />
    <text x="15" y="22" class="hud-alert">[ARCHITECTURE]</text>
    <text x="15" y="45" font-family="'Courier New', monospace" font-size="12" fill="#e6edf3" font-weight="bold">ZERO-VRAM HOGGING // 100% AIR-GAPPED</text>

    <!-- Column 2 -->
    <rect x="280" y="0" width="260" height="65" fill="#0d1722" stroke="#1f3246" stroke-width="1" />
    <text x="295" y="22" class="hud-alert">[MULTI-MODEL FLEET]</text>
    <text x="295" y="45" font-family="'Courier New', monospace" font-size="12" fill="#e6edf3" font-weight="bold">LLAMA-3.2 + QWEN-2.5 + DEEPSEEK-R1</text>

    <!-- Column 3 -->
    <rect x="560" y="0" width="260" height="65" fill="#0d1722" stroke="#1f3246" stroke-width="1" />
    <text x="575" y="22" class="hud-alert">[COMMS PROTOCOL]</text>
    <text x="575" y="45" font-family="'Courier New', monospace" font-size="12" fill="#e6edf3" font-weight="bold">P2P MESH // RETICULUM // MORSE // RF</text>
  </g>

  <!-- Right Radar Display -->
  <g transform="translate(1040, 160)">
    <!-- Outer rings -->
    <circle cx="0" cy="0" r="100" fill="#081018" stroke="#1f364d" stroke-width="1.5" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#182c40" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#1f364d" stroke-width="1" />
    <circle cx="0" cy="0" r="25" fill="none" stroke="#182c40" stroke-width="1" />
    <!-- Axes -->
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#182c40" stroke-width="1" />
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#182c40" stroke-width="1" />
    <!-- Radar Sweep Hand -->
    <g class="radar-line">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00e5ff" stroke-width="2" />
      <path d="M 0 0 L 100 -30 A 100 100 0 0 1 100 0 Z" fill="#00e5ff" fill-opacity="0.15" />
    </g>
    <!-- Center Point -->
    <circle cx="0" cy="0" r="4" fill="#00e5ff" />
    <!-- Targets detected -->
    <circle cx="35" cy="-40" r="3" fill="#3fb950" class="live-dot" />
    <circle cx="-50" cy="30" r="3" fill="#f1e05a" class="live-dot" />
    <circle cx="60" cy="50" r="3.5" fill="#00e5ff" class="live-dot" />
    <text x="-40" y="115" font-family="'Courier New', monospace" font-size="10" fill="#00e5ff" font-weight="bold">SECTOR: 360 DEG</text>
  </g>
</svg>